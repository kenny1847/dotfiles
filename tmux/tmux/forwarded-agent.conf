# A fixed hook index preserves other hooks and avoids duplicates on reload.
set-hook -g client-attached[1847] 'run-shell -b "~/.local/bin/refresh-forwarded-agent --tmux-socket #{q:socket_path} --session #{q:session_id}"'
set-hook -g client-session-changed[1847] 'run-shell -b "~/.local/bin/refresh-forwarded-agent --tmux-socket #{q:socket_path} --session #{q:session_id}"'
set-hook -g session-created[1847] 'run-shell -b "~/.local/bin/refresh-forwarded-agent --tmux-socket #{q:socket_path} --session #{q:session_id}"'
